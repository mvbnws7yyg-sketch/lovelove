<title>для жопы</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #080808;
        color: white;
        font-family: Arial, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;

        overflow: hidden;
    }

    .container {
        text-align: center;
        animation: appear 1.5s ease;
    }

    h1 {
        font-size: clamp(45px, 10vw, 100px);
        margin: 0;
        font-weight: 800;
        letter-spacing: -4px;

        animation: float 3s ease-in-out infinite;
    }

    .subtitle {
        margin-top: 20px;
        color: #777;
        font-size: 16px;
    }

    button {
        margin-top: 35px;
        padding: 14px 28px;

        border: 1px solid #333;
        border-radius: 50px;

        background: #111;
        color: white;

        font-size: 16px;
        cursor: pointer;

        transition: 0.3s;
    }

    button:hover {
        background: white;
        color: black;
        transform: scale(1.08);
    }

    #message {
        margin-top: 25px;
        font-size: 22px;
        min-height: 30px;
    }

    .heart {
        position: absolute;
        font-size: 20px;
        animation: fall linear forwards;
        pointer-events: none;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: scale(0.8);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-8px);
        }
    }

    @keyframes fall {
        from {
            transform: translateY(-50px) rotate(0deg);
            opacity: 1;
        }

        to {
            transform: translateY(110vh) rotate(360deg);
            opacity: 0;
        }
    }
</style>
XML
<div class="container">

    <h1>люблю тебя жопа</h1>

    <div class="subtitle">
        вот и всё.
    </div>

    <button onclick="love()">
        нажми сюда
    </button>

    <div id="message"></div>

</div>

<script>
    function love() {

        document.getElementById("message").textContent =
            "люблю тебя морда протокольная 🫵❤️";

        for (let i = 0; i < 25; i++) {

            const heart = document.createElement("div");

            heart.className = "heart";
            heart.textContent = "♥";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.top = "-30px";

            heart.style.animationDuration =
                (2 + Math.random() * 3) + "s";

            heart.style.fontSize =
                (12 + Math.random() * 25) + "px";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
    }
</script>
